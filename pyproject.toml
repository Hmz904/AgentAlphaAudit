[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-alpha-audit"
version = "0.5.0"
description = "Reproducible audit harness for autonomous quantitative research agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "Haoming Zhao"}]
dependencies = [
  "tables>=3.9",
  "pyarrow>=14",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
rdagent = ["rdagent==0.8.0", "pyqlib==0.9.7", "litellm==1.100.1"]

[project.scripts]
agent-alpha-audit = "agent_alpha_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["git_ignore_folder"]
